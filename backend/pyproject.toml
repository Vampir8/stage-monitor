[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-monitor-backend"
version = "0.1.0"
description = "Modular Stage Monitor REST and WebSocket backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3", "aiosqlite>=0.20,<1", "PyYAML>=6,<7",
  "jsonschema>=4.23,<5", "httpx>=0.27,<1", "tzdata>=2024",
  "websockets>=15,<18",
]

[project.optional-dependencies]
video = ["aiortc==1.14.0"]
serial = ["pyserial==3.5", "pyserial-asyncio==0.6"]
modbus = ["pymodbus==3.11.3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stage_monitor = ["plugins/*/manifest.yaml", "plugins/*/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
