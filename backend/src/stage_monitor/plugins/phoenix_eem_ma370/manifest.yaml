plugin_id: phoenix.eem_ma370
plugin_version: 0.1.0
plugin_api_version: '1.2'
entrypoint: stage_monitor.plugins.phoenix_eem_ma370.plugin:EEMMA370Plugin
manufacturer: Phoenix Contact
model: EEM-MA370
supported_protocols:
- modbus
communication_mode: polling
capabilities:
- id: power.monitoring
commands: []
telemetry:
- key: power.frequency
  title: Frequency
  value_type: number
  unit: Hz
- key: power.active
  title: Active power
  value_type: number
  unit: W
- key: power.energy_import
  title: Imported energy
  value_type: number
  unit: Wh
- key: power.current
  title: Current
  value_type: number
  unit: A
- key: power.voltage
  title: Voltage
  value_type: number
  unit: V
- key: power.factor
  title: Power factor
  value_type: number
- key: power.voltage_ll
  title: Line-to-line voltage
  value_type: number
  unit: V
- key: power.current_neutral
  title: Neutral current
  value_type: number
  unit: A
- key: power.reactive
  title: Reactive power
  value_type: number
  unit: var
- key: power.apparent
  title: Apparent power
  value_type: number
  unit: VA
- key: power.energy_export
  title: Exported energy
  value_type: number
  unit: Wh
configuration_schema:
  type: object
  x-default-port: 502
  properties:
    unit_id:
      type: integer
      title: Modbus Unit ID
      minimum: 1
      maximum: 247
      default: 1
    word_order:
      type: string
      title: Float32 word order
      enum:
      - low_first
      - high_first
      default: low_first
    request_timeout:
      type: number
      title: Response timeout (s)
      minimum: 0.5
      maximum: 3
      default: 2
  additionalProperties: false
dashboard:
  collapsed:
  - network:host
  - metric:power.frequency
  - metric:power.active
  - metric:power.energy_import
  - metric:power.current
  - metric:power.voltage
  - metric:power.factor
  - history:power.current
  expanded:
  - network:host
  - metric:power.frequency
  - metric:power.active
  - metric:power.energy_import
  - metric:power.current
  - metric:power.voltage
  - metric:power.factor
  - metric:power.voltage_ll
  - metric:power.current_neutral
  - metric:power.reactive
  - metric:power.apparent
  - metric:power.energy_export
  - history:power.current
